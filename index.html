<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090c11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lap Logger">
<meta name="description" content="スマホの GPS とセンサーで走行データを記録・分析するラップロガー">
<title>Lap Logger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="fonts/barlow-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand" id="brand">LAP LOGGER</div>
  <span id="recBadge" class="rec-badge" hidden>REC</span>
  <span id="trackChip" class="track-chip" hidden></span>
</header>

<main>
  <section id="view-log" class="view"></section>

  <section id="view-sessions" class="view">
    <div class="row" style="margin-bottom:6px">
      <h2 style="margin:0">セッション</h2><span class="spacer"></span>
      <label class="btn sm" id="lblImport"> 読み込み<input type="file" id="fileImport" accept=".csv,.gpx,.nmea,.nma,.txt,.json,.vbo,.log" multiple hidden></label>
      <button id="btnDemo" class="btn sm">デモデータ</button>
    </div>
    <p class="hint">読み込み対応: 本アプリの JSON / CSV、GPX、NMEA、VBO（VBOX）、緯度・経度・時刻を含む CSV（RaceChrono・AiM などの書き出し）</p>
    <div id="sessionList"></div>
  </section>

  <section id="view-analysis" class="view">
    <div class="ana-head">
      <div class="sesrow"><select id="anaSession" aria-label="セッション"></select><button class="btn icon-btn" id="anaExport" title="書き出し・共有" aria-label="書き出し・共有"></button></div>
      <div class="pick">
        <label><span class="sw ref"></span><select id="anaRef" aria-label="基準ラップ"></select></label>
        <label><span class="sw cmp"></span><select id="anaCmp" aria-label="比較ラップ"></select></label>
      </div>
      <div class="seg subtabs" id="anaSubtabs">
        <button data-sub="summary" class="active">概要</button><button data-sub="laps">ラップ</button><button data-sub="track">コース</button><button data-sub="charts">グラフ</button><button data-sub="corners">コーナー</button><button data-sub="gg">G-G</button>
      </div>
    </div>
    <div id="anaEmpty" class="empty">分析するセッションを選んでください。<br><span class="hint">「セッション」タブからも開けます。</span></div>
    <div id="anaBody" hidden>
      <div class="subview active" id="sv-summary"></div>
      <div class="subview" id="sv-laps"></div>
      <div class="subview" id="sv-track"></div>
      <div class="subview" id="sv-charts"></div>
      <div class="subview" id="sv-corners"></div>
      <div class="subview" id="sv-gg"></div>
    </div>
  </section>

  <section id="view-settings" class="view"></section>
</main>

<nav class="tabbar">
  <button data-view="log" data-icon="timer" class="active">計測</button>
  <button data-view="sessions" data-icon="list">セッション</button>
  <button data-view="analysis" data-icon="chart">分析</button>
  <button data-view="settings" data-icon="gear">設定</button>
</nav>

<div id="toast" class="toast" hidden></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
